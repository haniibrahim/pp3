<h4 class="subsection">2.2.1 <acronym>RPM</acronym> installation</h4>

<p>You should consider to use the <acronym>RPM</acronym> file, because it is the
simplest installation.  It works for SuSE Linux and probably also for
RedHat.  Just enter (as root)

<pre class="display">     <code>rpm -i </code><var>RPM-file-name</var><code></code>
</pre>

<p>That's it.
